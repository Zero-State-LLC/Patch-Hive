name: PR title

# Squash merges use the PR title as the commit on main, and release-please reads
# those commits. Keep titles in Conventional Commits form.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
            spec
            data
            ops
            infra
            release
            sync
            deps
          requireScope: false
