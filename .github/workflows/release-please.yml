name: Release Please

# Keeps one release PR open on main. Merging that PR tags the commit and creates
# the GitHub release. Nothing deploys from here.
on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    env:
      HAS_RELEASE_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          # GITHUB_TOKEN can open the release PR (org and repo allow Actions to
          # create pull requests). Optional: set RELEASE_PLEASE_TOKEN (fine-
          # grained PAT on this repo: Contents, Pull requests and Issues
          # read/write); a PAT-opened PR triggers CI on its own.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A release PR opened or updated with GITHUB_TOKEN gets no pull_request
      # runs, so its required checks never report. workflow_dispatch is the
      # one event GITHUB_TOKEN may start, and its check runs land on the
      # branch head, which satisfies the required checks by name.
      - name: Run required checks on the release PR branch
        if: ${{ steps.rp.outputs.pr != '' && env.HAS_RELEASE_PAT != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
        run: |
          for wf in ci.yml codeql.yml release.yml; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          done
