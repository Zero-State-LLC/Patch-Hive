name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: patchhive
          POSTGRES_PASSWORD: patchhive_test
          POSTGRES_DB: patchhive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://patchhive:patchhive_test@localhost:5432/patchhive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: No ModularGrid data or fetch code
        run: python scripts/check_no_modulargrid.py
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run backend suite (unit/api; acceptance excluded)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest tests --ignore=tests/acceptance -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npm run type-check
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
