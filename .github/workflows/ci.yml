name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: patchhive
          POSTGRES_PASSWORD: patchhive_test
          POSTGRES_DB: patchhive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://patchhive:patchhive_test@localhost:5432/patchhive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: No ModularGrid data or fetch code
        run: python scripts/check_no_modulargrid.py
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run backend suite (unit/api; acceptance excluded)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest tests --ignore=tests/acceptance -q

  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: patchhive
          POSTGRES_PASSWORD: patchhive_test
          POSTGRES_DB: patchhive_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # This job's own database: the suite migrates it to head and truncates every table
      # before each test, and refuses a database named patchhive.
      ACCEPTANCE_DATABASE_URL: postgresql://patchhive:patchhive_test@localhost:5432/patchhive_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Run acceptance suite (Postgres)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest tests/acceptance -q

  backend-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        working-directory: backend
        run: python -m ruff check canon evidence core patches/inventory_gate.py runs/bridge.py
      - name: Black
        working-directory: backend
        run: python -m black --check canon evidence
      - name: Mypy
        working-directory: backend
        run: python -m mypy canon/contracts.py canon/compiler.py canon/runes.py canon/downloads.py evidence/images.py
      - name: No canon or evidence imports of patchhive
        run: bash scripts/ai/check_no_canon_patchhive_imports.sh

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type-check
        working-directory: frontend
        run: npm run type-check
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (API mocked, no backend)
        working-directory: frontend
        run: npm run test:e2e
