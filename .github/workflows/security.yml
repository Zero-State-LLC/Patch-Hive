name: Security and Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action v2 requires a paid licence for organisations, which is
      # why this job has been failing. The gitleaks binary itself is MIT, so
      # run that directly instead. Same scanner, no licence.
      - name: Secret scan
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python dependency and static audit
        working-directory: backend
        run: |
          python -m pip install -e '.[dev]'
          python -m pip_audit
          python -m bandit -q -ll -r . -x ./.venv,./tests,./patchhive/tests,./patchhive/runes/tests
      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm run audit
      - name: Generate SBOMs
        run: |
          mkdir -p security-artifacts
          cd backend && cyclonedx-py environment --output-reproducible --output-file ../security-artifacts/python.cdx.json
          cd ../frontend && npm sbom --sbom-format cyclonedx > ../security-artifacts/npm.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: patchhive-sboms
          path: security-artifacts/*.json
