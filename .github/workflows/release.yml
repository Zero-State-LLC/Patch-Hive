name: Release

on:
  # Release Please opens its PR with GITHUB_TOKEN, which does not trigger
  # pull_request runs. release-please.yml dispatches this workflow instead.
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  version-consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check versions agree (and match the tag on tag pushes)
        run: python scripts/check_version_consistency.py ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: version-consistency
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release (pre-release for -alpha/-beta/-rc)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--generate-notes --verify-tag)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --title "$TAG" "${flags[@]}"
