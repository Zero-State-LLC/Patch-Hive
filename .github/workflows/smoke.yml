name: Live smoke

# Manual only. Read-only checks of a deployed host (frontend/tests/smoke): API health and
# release, security headers, routing, and the public pages. No sign-in, no writes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Host to check
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Smoke ${{ inputs.target }}
        working-directory: frontend
        env:
          SMOKE_BASE_URL: ${{ inputs.target == 'production' && 'https://patch-hive.com' || 'https://staging.patch-hive.com' }}
        run: npm run test:smoke
