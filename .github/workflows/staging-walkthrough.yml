name: Staging walkthrough

# Manual only, staging only (008 T030b/T040b, 006 T060b). Seeds the golden demo into
# the Neon staging branch, checks the seeded sign-in, runs the Design Engine
# walkthrough against api-staging.patch-hive.com with test payments, then uploads one
# generated test image, calls decision-resolution and generates through the API. It then
# generates another run, exports it with test credits and reads the pages of the PDF it
# downloads. That pack stays in the job's memory: this repo is public, so never upload a
# PDF or pack here. The `photo` choice instead runs spec 009's walkthrough from a fixture
# photo of a Rig, which staging reads from its recorded answer (backend/data/photo-readings).
# Each run makes new demo passwords that exist only in this job (masked, never stored); the
# receipts hold statuses, codes, counts and hashes only.
on:
  workflow_dispatch:
    inputs:
      checks:
        description: Which checks to run
        required: true
        type: choice
        default: both
        options: [both, walkthrough, evidence, generate, generated-export, photo]
      photo:
        description: The fixture photo of a Rig, for the photo walkthrough (spec 009 T060)
        required: false
        type: string
        default: fixtures/photo-walkthrough/rig.jpg
      rows:
        description: The rows that photo covers, "0" or "0-1"
        required: false
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: neon-db-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      ENVIRONMENT: staging
      PYTHONPATH: backend
      STAGING_API_URL: https://api-staging.patch-hive.com
      WALKTHROUGH_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e '.[staging-check]'
      - name: Demo passwords for this run
        run: |
          for name in PATCHHIVE_DEMO_USER_PASSWORD PATCHHIVE_DEMO_ADMIN_PASSWORD; do
            value="$(openssl rand -base64 33 | tr -d '\n/+=')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Seed the golden demo (T030b)
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PATCHHIVE_DATABASE_URL_STAGING }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::PATCHHIVE_DATABASE_URL_STAGING is not set"; exit 1; fi
          python scripts/seed_golden_demo.py
      - name: Design Engine walkthrough (T040b)
        if: inputs.checks == 'both' || inputs.checks == 'walkthrough'
        env:
          DATABASE_URL: ${{ secrets.PATCHHIVE_DATABASE_URL_STAGING }}
        run: python scripts/staging/design_engine_walkthrough.py --receipt-out design-walkthrough-receipt.json
      - name: Evidence upload and decision-resolution (T060b)
        if: ${{ !cancelled() && (inputs.checks == 'both' || inputs.checks == 'evidence') }}
        run: python scripts/staging/evidence_resolution_check.py --receipt-out t060b-receipt.json
      - name: A real generate through the API
        if: ${{ !cancelled() && (inputs.checks == 'both' || inputs.checks == 'generate') }}
        run: python scripts/staging/generate_check.py --receipt-out generate-receipt.json
      - name: Export a generated run and read its PDF
        if: ${{ !cancelled() && (inputs.checks == 'both' || inputs.checks == 'generated-export') }}
        run: python scripts/staging/generated_export_check.py --receipt-out generated-export-receipt.json
      - name: Photo walkthrough (spec 009 T060)
        if: ${{ !cancelled() && inputs.checks == 'photo' }}
        env:
          PHOTO: ${{ inputs.photo }}
          ROWS: ${{ inputs.rows }}
        run: python scripts/staging/photo_walkthrough.py --photo "$PHOTO" --rows "$ROWS" --receipt-out photo-walkthrough-receipt.json
      - name: Keep the receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-walkthrough-receipts
          path: |
            design-walkthrough-receipt.json
            t060b-receipt.json
            generate-receipt.json
            generated-export-receipt.json
            photo-walkthrough-receipt.json
          if-no-files-found: warn
          retention-days: 90
