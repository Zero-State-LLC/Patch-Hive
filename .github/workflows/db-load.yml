name: DB load

# Manual catalog load against Neon. Dry-run is the default and writes nothing.
# Apply mode dumps the affected tables first. The repo is public and Actions
# artifacts are downloadable by anyone, so the raw dump and the row-level upsert
# SQL never leave the runner: only the dump's size and sha256 go to the job
# summary, and the uploaded receipt holds counts only.
# DATABASE_URL is taken from Actions secrets and is never echoed.
# Apply writes only the plan an operator reviewed: run dry-run first, then apply with
# the plan_hash it printed. If the plan has changed in between, apply writes nothing.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Database to load
        required: true
        type: choice
        options: [staging, prod]
      mode:
        description: dry-run writes nothing; apply writes after a dump
        required: true
        type: choice
        default: dry-run
        options: [dry-run, apply]
      plan_hash:
        description: "apply only: the plan_hash from the reviewed dry run's summary"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: neon-db-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e .
      - name: Install pg_dump
        if: inputs.mode == 'apply'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load catalog
        env:
          DATABASE_URL: ${{ inputs.env == 'prod' && secrets.PATCHHIVE_DATABASE_URL_PROD || secrets.PATCHHIVE_DATABASE_URL_STAGING }}
          PATCHHIVE_DB_ENV: ${{ inputs.env }}
          PATCHHIVE_LOAD_MODE: ${{ inputs.mode }}
          PATCHHIVE_PLAN_HASH: ${{ inputs.plan_hash }}
        run: python scripts/catalog_actions_load.py --allow-nonlocal
      - name: Record pre-apply dump checksum
        if: inputs.mode == 'apply'
        run: |
          test -s load-artifacts/pre-apply.dump
          {
            printf '\n### Pre-apply dump (not uploaded)\n\n'
            printf -- '- bytes: %s\n' "$(stat -c %s load-artifacts/pre-apply.dump)"
            printf -- '- sha256: %s\n' "$(sha256sum load-artifacts/pre-apply.dump | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove raw dump and row-level SQL before upload
        if: always()
        run: rm -f load-artifacts/pre-apply.dump load-artifacts/population-upsert.sql
      - name: Upload counts-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-load-receipt-${{ inputs.env }}-${{ inputs.mode }}
          path: |
            load-artifacts/receipt.json
            load-artifacts/counts-before.json
            load-artifacts/counts-after.json
          if-no-files-found: warn
          retention-days: 7
