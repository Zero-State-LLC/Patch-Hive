name: Edge API secrets

# Manual only. Writes the runtime secrets of one edge/api Worker without any person
# seeing them: DATABASE_URL (the Neon pooled endpoint, from the existing repo secret),
# the R2 S3 keys (from a bucket-scoped R2 token this job creates), and SECRET_KEY
# (generated once, kept on later runs). This repo is public, so its logs are too:
# every derived value is masked before anything else runs, and no value is echoed.
#
# Needs repo secret CLOUDFLARE_API_TOKEN: an account token with
#   Account > Account API Tokens > Edit   (to create the R2 token)
#   Account > Workers Scripts > Edit       (to write Worker secrets)
# and repo variable CLOUDFLARE_ACCOUNT_ID. The Worker must already be deployed.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Which API Worker
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: edge-secrets-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.env }}
      BUCKET: ${{ inputs.env == 'production' && 'patchhive-prod-files' || 'patchhive-staging-files' }}
      SOURCE_DATABASE_URL: ${{ inputs.env == 'production' && secrets.PATCHHIVE_DATABASE_URL_PROD || secrets.PATCHHIVE_DATABASE_URL_STAGING }}
      WRANGLER_ENV_FLAG: ${{ inputs.env == 'production' && '' || '--env staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        working-directory: edge/api
        run: npm ci --no-audit --no-fund

      - name: Check inputs
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SOURCE_DATABASE_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; exit 1; fi
          done

      - name: Existing secret names
        id: existing
        working-directory: edge/api
        run: |
          # Names only; wrangler never returns values.
          npx wrangler secret list $WRANGLER_ENV_FLAG --format json > "$RUNNER_TEMP/names.json"
          if python3 -c "import json,sys; sys.exit(0 if any(s['name']=='SECRET_KEY' for s in json.load(open(sys.argv[1]))) else 1)" "$RUNNER_TEMP/names.json"; then
            echo "has_secret_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build secrets
        env:
          HAS_SECRET_KEY: ${{ steps.existing.outputs.has_secret_key }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, secrets, urllib.request
          from urllib.parse import urlsplit, urlunsplit

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          target = os.environ["TARGET"]
          bucket = os.environ["BUCKET"]
          api = f"https://api.cloudflare.com/client/v4/accounts/{account}"

          def mask(value):
              print(f"::add-mask::{value}", flush=True)

          def call(method, path, body=None):
              req = urllib.request.Request(
                  api + path,
                  method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={
                      "Authorization": f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
              if not data.get("success"):
                  raise SystemExit(f"Cloudflare API {method} {path} failed: {data.get('errors')}")
              return data["result"]

          # DATABASE_URL: Neon's pooled endpoint (spec 006 FR-003).
          url = os.environ["SOURCE_DATABASE_URL"].strip()
          mask(url)
          parts = urlsplit(url)
          if parts.password:
              mask(parts.password)
          host = parts.hostname or ""
          if host.startswith("ep-") and "-pooler." not in host:
              endpoint, rest = host.split(".", 1)
              netloc = parts.netloc.replace(host, f"{endpoint}-pooler.{rest}", 1)
              url = urlunsplit(parts._replace(netloc=netloc))
              mask(url)
          if "sslmode=" not in url:
              url += ("&" if parts.query else "?") + "sslmode=require"
              mask(url)

          # R2: a new account token scoped to this bucket, object read and write only.
          groups = call("GET", "/tokens/permission_groups")
          write = next(g for g in groups if g["name"] == "Workers R2 Storage Bucket Item Write")
          name = f"patchhive-api-{target}-r2"
          token = call("POST", "/tokens", {
              "name": name,
              "policies": [{
                  "effect": "allow",
                  "resources": {f"com.cloudflare.edge.r2.bucket.{account}_default_{bucket}": "*"},
                  "permission_groups": [{"id": write["id"]}],
              }],
          })
          access_key_id = token["id"]
          secret_access_key = hashlib.sha256(token["value"].encode()).hexdigest()
          mask(token["value"])
          mask(secret_access_key)

          values = {
              "DATABASE_URL": url,
              "S3_ENDPOINT_URL": f"https://{account}.r2.cloudflarestorage.com",
              "S3_ACCESS_KEY_ID": access_key_id,
              "S3_SECRET_ACCESS_KEY": secret_access_key,
          }
          if os.environ["HAS_SECRET_KEY"] != "true":
              key = secrets.token_urlsafe(48)
              mask(key)
              values["SECRET_KEY"] = key

          path = os.path.join(os.environ["RUNNER_TEMP"], "secrets.json")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as fh:
              json.dump(values, fh)
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"NEW_R2_TOKEN_ID={access_key_id}\n")
          print("Prepared secrets:", ", ".join(sorted(values)))
          PY

      - name: Write Worker secrets
        working-directory: edge/api
        run: |
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json" $WRANGLER_ENV_FLAG
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Revoke older R2 tokens for this Worker
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          name = f"patchhive-api-{os.environ['TARGET']}-r2"
          keep = os.environ["NEW_R2_TOKEN_ID"]
          api = f"https://api.cloudflare.com/client/v4/accounts/{account}/tokens"
          headers = {"Authorization": f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}"}
          req = urllib.request.Request(api + "?per_page=50", headers=headers)
          with urllib.request.urlopen(req, timeout=30) as resp:
              tokens = json.load(resp)["result"]
          old = [t["id"] for t in tokens if t["name"] == name and t["id"] != keep]
          for token_id in old:
              urllib.request.urlopen(
                  urllib.request.Request(f"{api}/{token_id}", method="DELETE", headers=headers),
                  timeout=30,
              )
          print(f"Revoked {len(old)} older token(s) named {name}")
          PY

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"
