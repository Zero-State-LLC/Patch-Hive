# Staging-like local/VPS stack — not production.
# - Backend image-built (no bind-mount); frontend-dev bind-mounts for iteration
# - No --reload on backend
# - Fail-closed flags; test payments only
#
# Usage (defaults: API :8000, FE :5173, DB :5432):
#   docker compose -f docker-compose.staging.yml up -d --build
#   curl -sf http://localhost:8000/health/ready
#
# Alternate ports (when host :8000 is busy):
#   STAGING_API_PORT=18000 STAGING_FE_PORT=15173 STAGING_DB_PORT=5433 \
#   STAGING_PUBLIC_API_URL=http://localhost:18000 \
#   STAGING_CORS_ORIGINS=http://localhost:15173,http://localhost:5173 \
#   docker compose -f docker-compose.staging.yml up -d --build
#   # or: powershell -File scripts/staging/smoke.ps1

services:
  db:
    image: postgres:15-alpine
    container_name: patchhive-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchhive
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-patchhive-staging-change-me}
      POSTGRES_DB: patchhive
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    ports:
      - "${STAGING_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchhive"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patchhive-staging-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://patchhive:${STAGING_DB_PASSWORD:-patchhive-staging-change-me}@db:5432/patchhive
      SECRET_KEY: ${STAGING_SECRET_KEY:?Set STAGING_SECRET_KEY, e.g. openssl rand -base64 32}
      CORS_ORIGINS: ${STAGING_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      APP_NAME: PatchHive
      APP_VERSION: ${STAGING_APP_VERSION:-0.3.0-alpha.1}
      ABX_CORE_VERSION: "1.2"
      ENVIRONMENT: staging
      ENFORCE_SEED_TRACEABILITY: "true"
      RUN_MIGRATIONS: "true"
      ENABLE_LEGACY_SOCIAL: "false"
      ENABLE_LEGACY_PUBLISHING: "false"
      ENABLE_LEGACY_LEADERBOARDS: "false"
      ENABLE_REFERRALS: "false"
      ENABLE_LEGACY_PATCHBOOK_DEBIT: "false"
      # PatchBook Design Engine (off by default; see docs/design/PATCHBOOK_STAGING_ENABLEMENT.md)
      ENABLE_PATCHBOOK_DESIGN_ENGINE: ${ENABLE_PATCHBOOK_DESIGN_ENGINE:-false}
      ENABLE_CANON_EXPORT_FULFILLMENT: ${ENABLE_CANON_EXPORT_FULFILLMENT:-false}
      ENABLE_INLINE_EXPORT_FULFILLMENT: ${ENABLE_INLINE_EXPORT_FULFILLMENT:-false}
      ENABLE_PATCHBOOK_PUBLICATION_PROFILE: ${ENABLE_PATCHBOOK_PUBLICATION_PROFILE:-false}
      STRIPE_TEST_MODE: "true"
      ALLOW_PRODUCTION_PAYMENTS: "false"
    ports:
      - "${STAGING_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Image-default command (uvicorn without --reload when Dockerfile sets it;
    # force explicit non-reload for staging-like behavior).
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend-dev:
    image: node:22-alpine
    container_name: patchhive-staging-frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      # Must match frontend/src/lib/api.ts (VITE_API_BASE_URL includes /api suffix).
      VITE_API_BASE_URL: ${STAGING_PUBLIC_API_URL:-http://localhost:8000}/api
    ports:
      - "${STAGING_FE_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - staging_frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  staging_postgres_data:
    driver: local
  staging_frontend_node_modules:
    driver: local

networks:
  default:
    name: patchhive-staging-network
